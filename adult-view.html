
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUVIFLICKHUB | Photo View</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
padding:20px;
background:#080b12;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}
header{
background:#101522;
padding:18px;
border-radius:12px;
color:#3b82f6;
font-size:24px;
font-weight:bold;
}
.photo{
max-width:420px;
margin:25px auto;
padding:12px;
background:#101522;
border:1px solid #283546;
border-radius:12px;
}
.photo img{
width:100%;
height:auto;
display:block;
border-radius:8px;
}
.btn{
display:inline-block;
padding:13px 25px;
background:#3b82f6;
color:white;
text-decoration:none;
font-weight:bold;
border-radius:8px;
}
.back{
display:block;
margin-top:20px;
color:#60a5fa;
text-decoration:none;
}
</style>
</head>

<body>


<header>NUVIFLICKHUB 18+</header>

<div class="photo">
  <img src="" alt="NUVIFLICKHUB Photo">
</div>

<button class="btn" id="downloadBtn" type="button">
  DOWNLOAD PHOTO
</button>

<div id="timer" style="color:#60a5fa;margin-top:15px;font-weight:bold"></div>

<a class="back" href="adult.html">← Back to Gallery</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YAHAN_ADMIN.HTML_WALI_API_KEY_PASTE_KARO",
  authDomain: "flixstream-b6d48.firebaseapp.com",
  projectId: "flixstream-b6d48",
  storageBucket: "flixstream-b6d48.firebasestorage.app",
  messagingSenderId: "161127372124",
  appId: "1:161127372124:web:5c91328cf68bd2b8021d99"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const photo = document.querySelector(".photo img");
const title = document.querySelector("header");
const btn = document.getElementById("downloadBtn");
const timer = document.getElementById("timer");

let downloadUrl = "";
let downloading = false;

async function loadPhoto() {
  try {
    const photoId = new URLSearchParams(location.search).get("photo");

    if (!photoId) {
      throw new Error("Photo ID nahi mila.");
    }

    const snap = await getDoc(doc(db, "adultPhotos", photoId));

    if (!snap.exists()) {
      throw new Error("Photo nahi mili.");
    }

    const data = snap.data();

    if (!data.imageUrl) {
      throw new Error("Image URL nahi mila.");
    }

    photo.src = data.imageUrl;
    photo.alt = data.title || "NUVIFLICKHUB Photo";

    title.textContent =
      "NUVIFLICKHUB 18+ | " + (data.title || "Photo View");

    downloadUrl = data.downloadUrl || data.imageUrl;

    photo.onerror = () => {
      timer.textContent = "Photo load nahi hui. Image link check karein.";
    };

    photo.onload = () => {
      timer.textContent = "";
    };

    btn.disabled = false;

  } catch (error) {
    timer.textContent = "Photo load error: " + error.message;
    btn.disabled = true;
  }
}

btn.addEventListener("click", () => {
  if (downloading || !downloadUrl) return;

  downloading = true;
  btn.disabled = true;

  let count = 6;

  timer.textContent =
    "Download starting in " + count + " seconds...";

  const interval = setInterval(() => {
    count--;

    if (count > 0) {
      timer.textContent =
        "Download starting in " + count + " seconds...";
    } else {
      clearInterval(interval);
      timer.textContent = "Opening photo...";

      window.location.href = downloadUrl;
    }
  }, 1000);
});

btn.disabled = true;
loadPhoto();
</script>

</body>
</html>
