
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIXSTREAM Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d12;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#101a20;border-bottom:1px solid #20c99a}
header h2{margin:0;color:#20c99a}
.container{max-width:700px;margin:auto;padding:20px}
.card{background:#121d24;padding:22px;border-radius:12px;margin:18px 0}
h1{font-size:25px}
h3{color:#20c99a}
input{width:100%;padding:13px;margin:9px 0;background:#080d12;border:1px solid #34434b;border-radius:7px;color:white}
button{background:#20c99a;color:#06120e;border:0;padding:13px 18px;border-radius:7px;font-weight:bold;cursor:pointer}
.note{color:#aab8bf;font-size:14px;line-height:1.6}
#dashboard{display:none}
#message{color:#ffb6b6;white-space:pre-wrap}
</style>
</head>
<body>
<header><h2>FLIXSTREAM ADMIN</h2></header>

<div class="container">
<div class="card" id="loginBox">
<h1>Admin Login 🔐</h1>
<p class="note">Login with your registered email and password.</p>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="message"></p>
</div>

<div id="dashboard">
<h1>Welcome to Admin Dashboard 🎬</h1>
<div class="card">
<h3>Movie Management</h3>
<p class="note">Your Firebase login is working. Movie management will be connected next.</p>
</div>
<div class="card">
<h3>Screenshots Gallery</h3>
<p class="note">Screenshot management will be added next.</p>
</div>
<button id="logoutBtn">Logout</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyA6Boo_uo8Ttw9GXd0GB16f6VTucF0s904",
 authDomain: "flixstream-b6d48.firebaseapp.com",
 projectId: "flixstream-b6d48",
 storageBucket: "flixstream-b6d48.firebasestorage.app",
 messagingSenderId: "161127372124",
 appId: "1:161127372124:web:5c91328cf68bd2b8021d99"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

document.getElementById("loginBtn").addEventListener("click", async () => {
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 message.textContent = "Please wait...";

 try {
  await signInWithEmailAndPassword(auth, email, password);
  message.textContent = "";
 } catch (error) {
  message.textContent = "Login failed: " + error.message;
 }
});

onAuthStateChanged(auth, (user) => {
 if (user) {
  loginBox.style.display = "none";
  dashboard.style.display = "block";
 } else {
  loginBox.style.display = "block";
  dashboard.style.display = "none";
 }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
 await signOut(auth);
});
</script>
</body>
</html>
