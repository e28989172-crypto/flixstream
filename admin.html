
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIXSTREAM Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d12;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#101a20;border-bottom:1px solid #20c99a}
header h2{margin:0;color:#20c99a}
.container{max-width:850px;margin:auto;padding:18px}
.card{background:#121d24;padding:20px;border-radius:12px;margin:16px 0}
h1{font-size:25px}
h3{color:#20c99a}
input,textarea,select{width:100%;padding:13px;margin:7px 0;background:#080d12;border:1px solid #34434b;border-radius:7px;color:white}
textarea{min-height:85px;resize:vertical}
button{background:#20c99a;color:#06120e;border:0;padding:11px 16px;border-radius:7px;font-weight:bold;margin:5px;cursor:pointer}
button.danger{background:#e34d5b;color:white}
button.secondary{background:#34434b;color:white}
.note{color:#aab8bf;font-size:13px;line-height:1.5}
.movie{border:1px solid #34434b;padding:14px;border-radius:9px;margin:12px 0}
.movie h3{margin:0 0 8px}
#dashboard{display:none}
#message{color:#ffb6b6;white-space:pre-wrap}
#status{color:#20c99a}
.preview{width:100%;max-height:260px;object-fit:contain;background:#080d12;border-radius:8px;margin-top:10px}
.field-label{display:block;color:#20c99a;margin-top:12px;font-size:14px}
.checkrow{display:flex;align-items:center;gap:10px;margin:12px 0}
.checkrow input{width:auto;margin:0;accent-color:#20c99a}
</style>
</head>
<body>
<header><h2>FLIXSTREAM ADMIN</h2></header>

<div class="container">
<div class="card" id="loginBox">
<h1>Admin Login 🔐</h1>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="message"></p>
</div>

<div id="dashboard">
<h1>Movie Management 🎬</h1>
<p class="note">Add, edit and delete your movie information.</p>
<p id="status"></p>

<!-- POPUP MANAGER -->
<div class="card">
<h1>Website Popup Manager 📢</h1>
<p class="note">Add an image or video link. It will appear as a popup on the website.</p>

<label class="field-label">Select Media Type</label>
<select id="popupType">
<option value="image">Image</option>
<option value="video">Video</option>
</select>

<label class="field-label">Image / Video URL</label>
<input id="popupMedia" type="url" placeholder="Paste image or video link">

<label class="field-label">Destination URL</label>
<input id="popupDestination" type="url" placeholder="Where should visitors go after clicking?">

<div class="checkrow">
<input type="checkbox" id="popupEnabled">
<label for="popupEnabled">Enable Website Popup</label>
</div>

<div id="popupPreviewBox" style="display:none">
<p class="note">Media Preview</p>
<div id="popupPreview"></div>
</div>

<button id="previewPopupBtn" class="secondary">Preview Media</button>
<button id="savePopupBtn">Save Popup Settings</button>
<button id="disablePopupBtn" class="danger">Turn Popup OFF</button>

<p id="popupStatus" class="note"></p>
</div>

<!-- MOVIE FORM -->
<div class="card">
<h3 id="formTitle">Add New Movie</h3>
<input id="movieTitle" placeholder="Movie Name *">
<input id="movieId" placeholder="Movie ID (automatic if empty)">
<input id="year" placeholder="Release Year">
<input id="genre" placeholder="Genre">
<input id="rating" placeholder="Rating (example: 8.5/10)">
<input id="director" placeholder="Director">
<input id="cast" placeholder="Cast (comma separated)">
<textarea id="story" placeholder="Movie Story / Description"></textarea>
<input id="poster" placeholder="Poster Image URL">
<textarea id="screenshots" placeholder="Screenshot URLs (comma separated)"></textarea>
<input id="trailer" placeholder="Official Trailer URL">
<input id="watchLink" placeholder="Official Watch URL">
<input id="downloadLink" placeholder="Authorized Download URL">
<button id="saveBtn">Save Movie</button>
<button id="clearBtn" class="secondary">Clear Form</button>
</div>

<div class="card">
<h3>All Movies</h3>
<div id="movieList">Loading movies...</div>
</div>
<button id="logoutBtn" class="danger">Logout</button>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
 getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
 getFirestore,collection,getDocs,doc,setDoc,deleteDoc,
 getDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyA6Boo_uo8Ttw9GXd0GB16f6VTucF0s904",
 authDomain: "flixstream-b6d48.firebaseapp.com",
 projectId: "flixstream-b6d48",
 storageBucket: "flixstream-b6d48.firebasestorage.app",
 messagingSenderId: "161127372124",
 appId: "1:161127372124:web:5c91328cf68bd2b8021d99"
};

const ADMIN_UID = "g9j2r2DbtIYxNkXupeJyoRL9qUC3";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let editingId = null;

$("loginBtn").onclick = async () => {
 $("message").textContent = "Please wait...";
 try {
  await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
  $("password").value = "";
 } catch(error) {
  $("message").textContent = "Login failed: " + error.message;
 }
};

onAuthStateChanged(auth,async user => {
 if(user && user.uid === ADMIN_UID) {
  $("loginBox").style.display = "none";
  $("dashboard").style.display = "block";
  $("message").textContent = "";
  await loadMovies();
  await loadPopupSettings();
 } else {
  $("loginBox").style.display = "block";
  $("dashboard").style.display = "none";
  if(user) await signOut(auth);
 }
});

/* POPUP MANAGER */

const popupRef = doc(db,"siteSettings","popup");

function validUrl(value) {
 try {
  const url = new URL(value);
  return url.protocol === "https:" || url.protocol === "http:";
 } catch {
  return false;
 }
}

function showPopupPreview() {
 const type = $("popupType").value;
 const url = $("popupMedia").value.trim();

 $("popupPreview").innerHTML = "";
 $("popupPreviewBox").style.display = "none";

 if(!validUrl(url)) {
  $("popupStatus").textContent = "Please enter a valid image or video URL.";
  return;
 }

 let media;

 if(type === "video") {
  media = document.createElement("video");
  media.src = url;
  media.controls = true;
  media.muted = true;
  media.playsInline = true;
 } else {
  media = document.createElement("img");
  media.src = url;
  media.alt = "Popup preview";
 }

 media.className = "preview";
 $("popupPreview").appendChild(media);
 $("popupPreviewBox").style.display = "block";
 $("popupStatus").textContent = "Preview ready.";
}

$("previewPopupBtn").onclick = showPopupPreview;

async function loadPopupSettings() {
 try {
  const snap = await getDoc(popupRef);

  if(snap.exists()) {
   const data = snap.data();
   $("popupType").value = data.mediaType || "image";
   $("popupMedia").value = data.mediaUrl || "";
   $("popupDestination").value = data.destinationUrl || "";
   $("popupEnabled").checked = data.enabled === true;
   if(data.mediaUrl) showPopupPreview();
   $("popupStatus").textContent = "Popup settings loaded.";
  } else {
   $("popupStatus").textContent = "No popup settings saved yet.";
  }
 } catch(error) {
  $("popupStatus").textContent = "Could not load popup: " + error.message;
 }
}

$("savePopupBtn").onclick = async () => {
 if(!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
  $("popupStatus").textContent = "Admin login required.";
  return;
 }

 const mediaUrl = $("popupMedia").value.trim();
 const destinationUrl = $("popupDestination").value.trim();

 if(!validUrl(mediaUrl)) {
  $("popupStatus").textContent = "Please enter a valid media URL.";
  return;
 }

 if(destinationUrl && !validUrl(destinationUrl)) {
  $("popupStatus").textContent = "Please enter a valid destination URL.";
  return;
 }

 try {
  $("popupStatus").textContent = "Saving popup settings...";

  await setDoc(popupRef,{
   mediaType: $("popupType").value,
   mediaUrl,
   destinationUrl,
   enabled: $("popupEnabled").checked,
   updatedAt: serverTimestamp()
  },{merge:true});

  $("popupStatus").textContent = "Popup settings saved successfully!";
 } catch(error) {
  $("popupStatus").textContent = "Error: " + error.message;
 }
};

$("disablePopupBtn").onclick = async () => {
 if(!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) return;

 try {
  await setDoc(popupRef,{
   enabled:false,
   updatedAt:serverTimestamp()
  },{merge:true});

  $("popupEnabled").checked = false;
  $("popupStatus").textContent = "Popup turned OFF.";
 } catch(error) {
  $("popupStatus").textContent = "Error: " + error.message;
 }
};

/* MOVIE MANAGEMENT */

function makeId(text) {
 return text.toLowerCase().trim()
  .replace(/[^a-z0-9]+/g,"-")
  .replace(/^-|-$/g,"");
}

function clearForm() {
 editingId = null;
 $("formTitle").textContent = "Add New Movie";
 $("saveBtn").textContent = "Save Movie";
 [
  "movieTitle","movieId","year","genre","rating",
  "director","cast","story","poster","screenshots",
  "trailer","watchLink","downloadLink"
 ].forEach(id => $(id).value = "");
}

$("clearBtn").onclick = clearForm;

$("saveBtn").onclick = async () => {
 if(!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
  $("status").textContent = "Admin login required.";
  return;
 }

 const title = $("movieTitle").value.trim();
 const id = editingId || makeId($("movieId").value || title);

 if(!title || !id) {
  $("status").textContent = "Movie Name is required.";
  return;
 }

 const movieRef = doc(db,"movies",id);

 const data = {
  title,
  year:$("year").value.trim(),
  genre:$("genre").value.trim(),
  rating:$("rating").value.trim(),
  director:$("director").value.trim(),
  cast:$("cast").value.split(",").map(x=>x.trim()).filter(Boolean),
  story:$("story").value.trim(),
  poster:$("poster").value.trim(),
  screenshots:$("screenshots").value.split(",").map(x=>x.trim()).filter(Boolean),
  trailer:$("trailer").value.trim(),
  watch:$("watchLink").value.trim(),
  downloadLink:$("downloadLink").value.trim()
 };

 try {
  $("status").textContent = "Saving movie...";
  const oldMovie = await getDoc(movieRef);

  if(oldMovie.exists() && oldMovie.data().createdAt) {
   data.createdAt = oldMovie.data().createdAt;
  } else {
   data.createdAt = serverTimestamp();
  }

  await setDoc(movieRef,data);
  $("status").textContent = "Movie saved successfully!";
  clearForm();
  await loadMovies();
 } catch(error) {
  $("status").textContent = "Error: " + error.message;
 }
};

async function loadMovies() {
 try {
  const result = await getDocs(collection(db,"movies"));
  const list = $("movieList");
  list.innerHTML = "";

  if(result.empty) {
   list.textContent = "No movies added yet.";
   return;
  }

  const movies = result.docs.sort((a,b) => {
   const timeA = a.data().createdAt?.toMillis?.() || 0;
   const timeB = b.data().createdAt?.toMillis?.() || 0;
   return timeB - timeA;
  });

  movies.forEach(item => {
   const data = item.data();
   const box = document.createElement("div");
   box.className = "movie";

   const heading = document.createElement("h3");
   heading.textContent = data.title || item.id;

   const details = document.createElement("p");
   details.className = "note";
   details.textContent = (data.year || "") + " • " + (data.genre || "");

   const edit = document.createElement("button");
   edit.textContent = "Edit";
   edit.onclick = () => editMovie(item.id,data);

   const remove = document.createElement("button");
   remove.textContent = "Delete";
   remove.className = "danger";
   remove.onclick = () => removeMovie(item.id);

   box.append(heading,details,edit,remove);
   list.appendChild(box);
  });
 } catch(error) {
  $("movieList").textContent = "Error: " + error.message;
 }
}

function editMovie(id,data) {
 editingId = id;
 $("formTitle").textContent = "Edit Movie";
 $("saveBtn").textContent = "Update Movie";

 $("movieTitle").value = data.title || "";
 $("movieId").value = id;
 $("year").value = data.year || "";
 $("genre").value = data.genre || "";
 $("rating").value = data.rating || "";
 $("director").value = data.director || "";
 $("cast").value = Array.isArray(data.cast) ? data.cast.join(", ") : (data.cast || "");
 $("story").value = data.story || "";
 $("poster").value = data.poster || data.posterUrl || "";
 $("screenshots").value = Array.isArray(data.screenshots) ? data.screenshots.join(", ") : "";
 $("trailer").value = data.trailer || data.trailerUrl || "";
 $("watchLink").value = data.watch || data.watchLink || data.watchUrl || "";
 $("downloadLink").value = data.downloadLink || "";

 window.scrollTo({top:0,behavior:"smooth"});
}

async function removeMovie(id) {
 if(!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) return;
 if(!confirm("Are you sure you want to delete this movie?")) return;

 try {
  await deleteDoc(doc(db,"movies",id));
  $("status").textContent = "Movie deleted.";
  if(editingId === id) clearForm();
  await loadMovies();
 } catch(error) {
  $("status").textContent = "Error: " + error.message;
 }
}

$("logoutBtn").onclick = () => signOut(auth);
</script>
</body>
</html>
