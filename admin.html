
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIXSTREAM Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d12;color:white;font-family:Arial,sans-serif}
header{background:#101a20;padding:20px;border-bottom:1px solid #20c99a}
header h2{margin:0;color:#20c99a}
.container{padding:20px;max-width:900px;margin:auto}
.card{background:#121d24;padding:20px;border-radius:12px;margin:15px 0}
h1{font-size:25px}
h3{color:#20c99a}
button{background:#20c99a;color:#06120e;border:0;padding:12px 18px;border-radius:7px;font-weight:bold}
input{width:100%;padding:13px;margin:8px 0;background:#080d12;border:1px solid #34434b;border-radius:7px;color:white}
.note{color:#aab8bf;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<header>
<h2>FLIXSTREAM ADMIN</h2>
</header>
<div class="container">
<h1>Welcome to Admin Dashboard</h1>
<p class="note">Manage your FLIXSTREAM movie website</p>

<div class="card">
<h3>🎬 Movie Management</h3>
<p>Add and manage movies</p>
<input placeholder="Movie Name">
<input placeholder="Movie Poster URL">
<input placeholder="Release Year">
<input placeholder="Genre">
<button type="button">Add Movie</button>
</div>

<div class="card">
<h3>🖼️ Screenshots Gallery</h3>
<p>Add movie screenshots</p>
<input placeholder="Screenshot Image URL">
<button type="button">Add Screenshot</button>
</div>

<div class="card">
<h3>🔗 Movie Links</h3>
<p>Add official watch and authorized download links</p>
<input placeholder="Official Watch Link">
<input placeholder="Authorized Download Link">
<button type="button">Save Links</button>
</div>

<p class="note">FLIXSTREAM Admin • Dashboard Setup</p>
</div>
</body>
</html>
