
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUVIFLICKHUB 18+</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#080b12;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}
header{
background:#101522;
padding:12px;
text-align:center;
border-radius:12px;
color:white;
font-size:16px;
font-weight:bold;
}
header small{
display:block;
margin-top:4px;
color:#3b82f6;
font-size:12px;
font-weight:normal;
}
.gallery{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:15px;
margin-top:22px;
}
.movie-card{
background:#101522;
border:1px solid #283546;
border-radius:10px;
overflow:hidden;
}
.movie-card img{
width:100%;
aspect-ratio:2/3;
object-fit:cover;
display:block;
}
.movie-card h3{
font-size:14px;
padding:10px;
margin:0;
}
a{color:white;text-decoration:none}
</style>
</head>

<body>

<header>
  <div>NUVIFLICKHUB 18+</div>
  <small>Get 2 New Videos Every Day!</small>
</header>

<div class="gallery" id="adultGallery">
  <p id="galleryStatus">Loading photos...</p>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyA6Boo_uo8Ttw9GXd0GB16f6VTucF0s904",
  authDomain: "flixstream-b6d48.firebaseapp.com",
  projectId: "flixstream-b6d48",
  storageBucket: "flixstream-b6d48.firebasestorage.app",
  messagingSenderId: "161127372124",
  appId: "1:161127372124:web:5c91328cf68bd2b8021d99"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const gallery = document.getElementById("adultGallery");
const status = document.getElementById("galleryStatus");

async function loadGallery() {
  try {
    const snapshot = await getDocs(collection(db, "adultPhotos"));
    gallery.replaceChildren();

    if (snapshot.empty) {
      status.textContent = "Abhi koi photo available nahi hai.";
      gallery.appendChild(status);
      return;
    }

    snapshot.forEach(photoDoc => {
      const data = photoDoc.data();

      const link = document.createElement("a");
      link.href = "adult-view.html?photo=" + encodeURIComponent(photoDoc.id);
      link.className = "movie-card";

      const img = document.createElement("img");
      img.src = data.imageUrl;
      img.alt = data.title || "18+ Photo";
      img.loading = "lazy";

      const title = document.createElement("h3");
      title.textContent = data.title || "View Photo";

      link.append(img, title);
      gallery.appendChild(link);
    });
  } catch (error) {
    status.textContent = "Gallery load error: " + error.message;
    gallery.appendChild(status);
  }
}

loadGallery();
</script>

</body>
</html>
