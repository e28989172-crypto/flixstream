<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUVIFLICKHUB 18+</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080b12;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

header{
background:#101522;
padding:12px;
text-align:center;
border-radius:12px;
color:white;
font-size:16px;
font-weight:bold;
}

header small{
display:block;
margin-top:4px;
color:#3b82f6;
font-size:12px;
font-weight:normal;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:15px;
margin-top:22px;
}

.movie-card{
background:#101522;
border:1px solid #283546;
border-radius:10px;
overflow:hidden;
}

.movie-card img{
width:100%;
aspect-ratio:2/3;
object-fit:cover;
display:block;
background:#101522;
}

.movie-card h3{
font-size:14px;
padding:10px;
margin:0;
}

a{
color:white;
text-decoration:none;
}

#galleryStatus{
text-align:center;
color:#94a3b8;
font-size:13px;
margin-top:15px;
}

.load-more{
display:block;
width:100%;
max-width:260px;
margin:25px auto;
padding:12px;
background:#2563eb;
color:white;
border:0;
border-radius:8px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.load-more:disabled{
opacity:.6;
cursor:not-allowed;
}

.load-more:active{
background:#1d4ed8;
}
</style>
</head>

<body>

<header>
  <div>NUVIFLICKHUB 18+</div>
  <small>Get 2 New Videos Every Day!</small>
</header>

<div class="gallery" id="adultGallery"></div>

<p id="galleryStatus">Loading photos...</p>

<button class="load-more" id="loadMoreBtn" hidden>
Load More Photos
</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  limit,
  startAfter
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyA6Boo_uo8Ttw9GXd0GB16f6VTucF0s904",
  authDomain:"flixstream-b6d48.firebaseapp.com",
  projectId:"flixstream-b6d48",
  storageBucket:"flixstream-b6d48.firebasestorage.app",
  messagingSenderId:"161127372124",
  appId:"1:161127372124:web:5c91328cf68bd2b8021d99"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const gallery = document.getElementById("adultGallery");
const status = document.getElementById("galleryStatus");
const loadMoreBtn = document.getElementById("loadMoreBtn");

const PAGE_SIZE = 12;

let lastVisible = null;
let isLoading = false;
let hasMore = true;
let firstLoad = true;

async function loadGallery(){

  if(isLoading || !hasMore) return;

  isLoading = true;
  loadMoreBtn.disabled = true;
  loadMoreBtn.textContent = "Loading...";

  status.textContent = firstLoad
    ? "Loading photos..."
    : "Loading more photos...";

  try{

    const photosRef = collection(db,"adultPhotos");

    let photosQuery;

    if(lastVisible){
      photosQuery = query(
        photosRef,
        startAfter(lastVisible),
        limit(PAGE_SIZE)
      );
    }else{
      photosQuery = query(
        photosRef,
        limit(PAGE_SIZE)
      );
    }

    const snapshot = await getDocs(photosQuery);

    if(snapshot.empty){

      hasMore = false;

      status.textContent = firstLoad
        ? "Abhi koi photo available nahi hai."
        : "All photos loaded.";

      loadMoreBtn.hidden = true;
      return;
    }

    lastVisible = snapshot.docs[snapshot.docs.length - 1];

    snapshot.forEach(photoDoc => {

      const data = photoDoc.data();

      if(typeof data.imageUrl !== "string" || !data.imageUrl){
        return;
      }

      const link = document.createElement("a");

      link.href =
        "adult-view.html?photo=" +
        encodeURIComponent(photoDoc.id);

      link.className = "movie-card";

      const img = document.createElement("img");

      img.src = data.imageUrl;
      img.alt = data.title || "18+ Photo";
      img.loading = "lazy";
      img.decoding = "async";
      img.fetchPriority = "low";

      const title = document.createElement("h3");

      title.textContent = data.title || "View Photo";

      link.append(img,title);
      gallery.appendChild(link);

    });

    hasMore = snapshot.docs.length === PAGE_SIZE;

    firstLoad = false;

    if(hasMore){
      loadMoreBtn.hidden = false;
      loadMoreBtn.textContent = "Load More Photos";
      status.textContent = "";
    }else{
      loadMoreBtn.hidden = true;
      status.textContent = "All photos loaded.";
    }

  }catch(error){

    console.error("Gallery Error:",error);

    status.textContent = "Gallery load error. Please try again.";

    loadMoreBtn.hidden = false;
    loadMoreBtn.textContent = "Retry";

  }finally{

    isLoading = false;
    loadMoreBtn.disabled = false;

  }
}

loadMoreBtn.addEventListener("click",loadGallery);

loadGallery();

</script>

</body>
</html>
